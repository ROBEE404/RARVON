[package]
name = "bench-engine"
version = "0.1.0"
description = "Rarvon for desktop (beta): serves Rarvon on this computer and opens it in a browser app window"
authors = ["ROBEE"]
edition = "2021"
publish = false
build = "build.rs"

[dependencies]
tiny_http = "0.12"
getrandom = "0.2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
